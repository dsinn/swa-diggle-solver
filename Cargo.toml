[package]
name = "diggle-solver"
version = "0.2.0"
edition = "2021"

[dependencies]
mlua = { version = "0.10", features = ["luajit", "vendored"] }
windows = { version = "0.58", features = [
    "Foundation_Numerics",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    # The Advisor implements IDWriteInlineObject to draw item icons in its list.
    "implement",
] }
# The `implement` macro expands to `::windows_core` paths, so it has to be a direct dependency.
windows-core = "0.58"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
# Lets `diggle shot` emit a viewable PNG, and observe::template load the game's own
# location sprites for matching. Pure Rust, so it does not threaten the verified
# single-exe/no-install property.
png = "0.17"

[profile.release]
lto = true
