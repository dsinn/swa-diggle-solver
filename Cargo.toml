[package]
name = "diggle-solver"
version = "0.1.0"
edition = "2021"

[dependencies]
mlua = { version = "0.10", features = ["luajit", "vendored"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"

[profile.release]
lto = true
