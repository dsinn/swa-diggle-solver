# The repo's own style, written down so that rustfmt agrees with it rather than fights it.
#
# **Nothing here has been run over the tree.** This file exists so that a `cargo fmt` — deliberate or
# accidental — reformats as little as possible, and so that the style is a setting rather than a
# convention nobody wrote down. See the note at the bottom before running one.
#
# ## Measured, 2026-08-23, over all 117 files and 63,416 lines of `src/`
#
#   rustfmt defaults          11,453 lines move   (18.1%)
#   this file                  3,537 lines move    (5.6%)
#
# So the settings below account for roughly seven tenths of the disagreement, and the rest is
# genuine: some of it rustfmt correcting lines that really are over 100 columns, some of it rustfmt
# expanding compact shapes this codebase writes on purpose.
#
# ## 120 was tried, and it is worse. Do not re-propose it without new evidence
#
# Same measurement, same three files' worth of settings, only the width moved:
#
#   max_width = 100    3,537 lines move   (5.6%)
#   max_width = 110    3,444 lines move   (5.4%)
#   max_width = 120    4,351 lines move   (6.9%)
#
# Widening *increases* the disagreement, which is the opposite of the intuition. The repo is written
# to 100, so a wider budget does not stop rustfmt breaking lines — it starts rustfmt **joining**
# lines that are deliberately broken. 110 is a wash and not worth the churn of finding out.
#
# There is a second reason and it is the one that settles it. The doc comments here are the primary
# artifact, they are hand-wrapped to 100, and rustfmt does not touch them (`wrap_comments` is off by
# default and should stay off). Code at 120 beside prose at 100 reads badly and drifts further every
# time someone writes to the new budget.
#
# 100 is also rustfmt's own default and the Rust ecosystem's norm; 120 is the convention of other
# languages' tooling.
#
# ## Over half of what is left is us, not rustfmt
#
# Of the 3,537 lines that move at `max_width = 100`, **1,916 are in hunks containing a line that is
# genuinely over 100 columns** — 2,355 such lines exist in `src/`. Those are not a style
# disagreement; they are rustfmt correcting the file. The real disagreement is nearer 1,600 lines,
# or 2.5% of the tree.
#
# The rest of that taxonomy — "rustfmt joins", "rustfmt splits", "reshaped" — is approximate and
# should not be quoted: it comes from diffing line lists, which mispairs hunks. One example it
# produced (an enum variant supposedly being exploded one field per line) turned out on inspection to
# be a mispairing and not a thing rustfmt does at all under these settings.
#
# ## Why each setting
#
# `max_width` is not the interesting setting and was never the problem — the repo already writes to
# 100 columns, measured: the 95th percentile line is exactly 100 and only 1.19% run past 101. It is
# set explicitly anyway, because it is the number every heuristic below is a fraction of.
#
# `use_small_heuristics = "Max"` is the one that matters, and it is the whole of the first
# measurement above. The sub-widths default to fractions of `max_width` — `chain_width` to 60% — so
# a method chain that fits comfortably inside 100 columns still gets exploded one call per line:
#
#     self.places.get(to).map(|p| p.triggers_anomaly()).unwrap_or(false)
#
# becomes five lines under the defaults and stays as it is written here. This file is full of that
# shape and it is more readable in one piece.
#
# `fn_params_layout = "Compressed"` keeps a long signature's parameters on a continuation line
# instead of one per line, which is how every wide signature in this repo is already written:
#
#     fn best_rest_site<'a>(
#         &'a self, here: &str, dist: &BTreeMap<String, usize>, ok: &dyn Fn(&Place) -> bool,
#     ) -> Option<&'a Place>
#
# It is worth little on its own — six lines out of 697 on the file it was measured against — and is
# here for the signatures rather than for the count.
#
# All three are stable; checked against rustfmt 1.9.0-stable.
#
# ## The tree is formatted, and the check is what keeps it that way
#
# As of `1e7503e` the whole tree agrees with this file, so:
#
#     cargo fmt --all --check     # exit 0 when clean, 1 and a diff when not
#     cargo fmt --all             # fix it
#
# `--check` is the `mix format --check-formatted` of Rust: it writes nothing and its exit code is
# the answer. `hooks/pre-commit` in this repo is a two-line wrapper round it; enable it once per
# clone with `git config core.hooksPath hooks`.
#
# **`cargo fmt` formats every target, and `-- <path>` does not narrow it.** Those arguments are
# flags for rustfmt, not a file filter, so `cargo fmt -- src/navigate/drive.rs` reformats the whole
# crate. That is not hypothetical — it happened on 2026-08-23, before the tree was formatted, and
# took 112 files with it. To format one file, run `rustfmt --edition 2021 <file>`. Now that the tree
# is clean the blast radius of the mistake is nil, but the flag still does not mean what it looks
# like it means.
#
# ## What the reformat was and was not worth
#
# It fixed **362 over-long code lines** (441 down to 79). Not the ~1,900 first claimed for it: that
# figure counted diff hunks *containing* a line over 100 columns, and the long lines here are
# overwhelmingly **comments**, which rustfmt does not touch — 1,914 of the 2,355, and still 1,921
# afterwards.
#
# 362 lines would have been a thin reason for a 92-file diff on its own. The gate is the reason: it
# cannot be used at all until the tree agrees with the config, and it removes formatting from the
# list of things anyone has to think about again.
#
# The objection it had to answer was archaeology — this project works out why a line is the way it
# is by reading `git blame`, and the doc comments cite dates and runs on nearly every page. The
# format commit is listed in `.git-blame-ignore-revs`, which git honours via
# `git config blame.ignoreRevsFile .git-blame-ignore-revs`. A handful of lines per file still blame
# to it: the ones rustfmt *created*, closing delimiters like `})` and `));` with no earlier revision
# to attribute them to. Fourteen such lines in the worst file, and nobody reads blame on a `})`.

max_width = 100
use_small_heuristics = "Max"
fn_params_layout = "Compressed"
